name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on a branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !tests/claude-code/README.md

  validate-plugin-manifests:
    name: Validate marketplace.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON syntax
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Required fields and plugin entry
        run: |
          python3 - <<'PY'
          import json, sys

          with open('.claude-plugin/marketplace.json') as f:
              marketplace = json.load(f)

          for field in ('name', 'owner', 'plugins'):
              if field not in marketplace:
                  sys.exit(f"ERROR: marketplace.json missing required field: {field}")
          if not isinstance(marketplace['plugins'], list) or not marketplace['plugins']:
              sys.exit("ERROR: marketplace.json 'plugins' must be a non-empty array")
          if marketplace['name'] != 'c4-model-skill':
              sys.exit(f"ERROR: marketplace.json name is '{marketplace['name']}', expected 'c4-model-skill'")

          entry = next((p for p in marketplace['plugins'] if p.get('name') == 'c4-model'), None)
          if entry is None:
              sys.exit("ERROR: marketplace.json does not list a plugin with name 'c4-model'")
          for field in ('name', 'description', 'version', 'source'):
              if field not in entry:
                  sys.exit(f"ERROR: plugin entry 'c4-model' missing required field: {field}")

          print('marketplace.json: valid, plugin entry complete')
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./tests/claude-code
          severity: warning

  check-executable:
    name: Test scripts are executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exec bits
        run: |
          set -e
          for script in \
            tests/claude-code/run-skill-tests.sh \
            tests/claude-code/test-c4-model.sh \
            tests/claude-code/test-c4-model-integration.sh
          do
            if [[ ! -x "$script" ]]; then
              echo "ERROR: $script is not executable"
              exit 1
            fi
            echo "OK: $script is executable"
          done

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    # Link checks are allowed to fail — external URLs come and go
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --max-concurrency 3 './**/*.md'
          fail: false
